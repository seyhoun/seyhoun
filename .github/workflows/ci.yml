name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Go backend ────────────────────────────────────────────────────────
  go:
    name: Go
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: seyhoun_test
          POSTGRES_USER: seyhoun
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seyhoun -d seyhoun_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: seyhoun_test
      DATABASE_USER: seyhoun
      DATABASE_PASSWORD: testpassword
      DATABASE_SSLMODE: disable
      AUTH_JWT_SECRET: ci-test-secret-do-not-use-in-prod
      # Explicit DSN for testutil — must match the postgres service above
      TEST_DATABASE_DSN: "host=localhost user=seyhoun password=testpassword dbname=seyhoun_test port=5432 sslmode=disable TimeZone=UTC"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -timeout 120s

  # ── Frontend ──────────────────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Type-check
        run: npx tsc --noEmit
        working-directory: web

      - name: Lint
        run: npx eslint src/
        working-directory: web

      - name: Test
        run: npx vitest run
        working-directory: web

  # ── Docker build validation ───────────────────────────────────────────
  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [go, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker compose build
        env:
          DATABASE_PASSWORD: ci-build-placeholder
          AUTH_JWT_SECRET: ci-build-placeholder
